services:
  jazz:
    build:
      context: ../..
      dockerfile: stacks/jazz-v2/Dockerfile
    ports:
      - "3227:3227"
    volumes:
      - jazz-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3227/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 5s
      retries: 60

volumes:
  jazz-data:
