name: offline-sync-bench-syncular

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - syncular-bench-pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "3230:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - syncular-bench-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/syncular-blobs || true
      "

  syncular:
    build:
      context: ../../
      dockerfile: stacks/syncular/Dockerfile
    command: ["bun", "src/server.ts"]
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      PORT: "3000"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:3230
      S3_REGION: us-east-1
      S3_BUCKET: syncular-blobs
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3210:3000"

  admin:
    build:
      context: ../../
      dockerfile: stacks/syncular/Dockerfile
    command: ["bun", "src/admin.ts"]
    environment:
      DATABASE_URL: postgresql://bench:bench@postgres:5432/bench
      PORT: "3000"
      STACK_ID: syncular
    depends_on:
      postgres:
        condition: service_healthy
      syncular:
        condition: service_healthy
    ports:
      - "3211:3000"

volumes:
  syncular-bench-pgdata:
  syncular-bench-minio:
